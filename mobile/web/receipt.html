<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <!-- Force desktop view on mobile (CamScanner style) -->
    <meta name="viewport" content="width=850" />
    <title id="pageTitle">Order Summary • SnapKhata</title>

    <!-- Open Graph -->
    <meta property="og:title" id="ogTitle" content="Order Summary • SnapKhata" />
    <meta property="og:description" content="View your complete order details and receipt." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #eceff1;
            --white: #ffffff;
            --border: #cccccc;
            --border-strong: #000000;
            --text-primary: #000000;
            --text-secondary: #333333;
            --text-muted: #555555;
            --accent: #000000;
            --accent-dark: #000000;
            --accent-light: #f5f5f5;
            --green: #000000;
            --green-bg: #ffffff;
            --green-border: #cccccc;
            --amber: #000000;
            --amber-bg: #ffffff;
            --amber-border: #cccccc;
            --red: #000000;
            --invoice-bg: #ffffff;
            --invoice-border: #000000;
        }

        * {
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
        }

        /* ── Loader ── */
        .loader-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: var(--bg);
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loader-text {
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 500;
        }

        .loader-sub {
            color: var(--text-muted);
            font-size: 13px;
        }

        /* ── Error ── */
        .error-wrap {
            min-height: 100vh;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
        }

        .error-icon {
            font-size: 52px;
            margin-bottom: 16px;
        }

        .error-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--red);
            margin-bottom: 8px;
        }

        .error-desc {
            color: var(--text-secondary);
            max-width: 380px;
            margin-bottom: 24px;
        }

        .btn-retry {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        /* ── Content wrapper ── */
        #content-wrap {
            display: none;
            width: 100%;
            overflow-x: hidden;
        }
 
        
        /* ── Desktop Container ── */
        .scaled-container {
            width: 850px;
            margin: 0 auto;
            padding: 40px 0 80px;
            display: flex;
            justify-content: center;
        }

        /* ─────────────────────────────────────────────────────
           TABULAR DOCUMENT STYLES
        ───────────────────────────────────────────────────── */
        .inv-page {
            width: 100%;
            margin: 0 auto;
            color: var(--text-primary);
        }

        .inv-doc-title {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #334155;
        }

        .inv-doc {
            background: #fff;
            border: 1px solid var(--border-strong);
            width: 100%;
            margin-bottom: 24px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .inv-header-grid {
            display: grid;
            grid-template-columns: 1fr;
            border-bottom: 1px solid var(--border-strong);
            width: 100%;
        }

        .inv-shop-info {
            padding: 16px;
            border-bottom: 1px solid var(--border-strong);
        }

        .inv-shop-name {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .inv-shop-detail, .inv-gst-number {
            font-size: 13px;
            color: #334155;
        }

        .inv-meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: stretch;
        }

        .inv-bill-to {
            padding: 12px 16px;
            border-right: 1px solid var(--border-strong);
            align-self: stretch;
            box-sizing: border-box;
        }

        .inv-invoice-details {
            padding: 12px 16px;
            align-self: stretch;
        }

        .inv-col-label {
            font-size: 13px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 8px;
        }

        .inv-col-val {
            font-size: 13px;
            color: #334155;
            line-height: 1.5;
        }

        .inv-col-val strong {
            font-weight: 600;
            color: #1e293b;
        }

        .inv-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            border-bottom: 1px solid var(--border-strong);
            border-left: 0;
            border-right: 0;
            border-top: 0;
        }

        .inv-table th {
            padding: 8px 12px;
            font-weight: 700;
            color: #1e293b;
            border-bottom: 1px solid var(--border-strong);
            border-right: 1px solid var(--border-strong);
            border-left: none;
            text-align: left;
        }

        .inv-table th:last-child {
            border-right: none;
        }

        .inv-table th:first-child {
            border-left: none;
            padding-left: 16px;
        }

        .inv-table td {
            padding: 8px 12px;
            color: #334155;
            border-right: 1px solid var(--border-strong);
            border-bottom: 1px solid var(--border-strong);
            border-left: none;
            vertical-align: top;
        }

        .inv-table td:last-child {
            border-right: none;
        }

        .inv-table td:first-child {
            border-left: none;
            padding-left: 16px;
        }

        .inv-table .right { text-align: right; }
        .inv-table .center { text-align: center; }

        .inv-summary-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            align-items: stretch;
            border-bottom: 1px solid var(--border-strong);
        }

        .inv-empty-left {
            padding: 12px 16px;
            border-right: 1px solid var(--border-strong);
            align-self: stretch;
            box-sizing: border-box;
            min-height: 100%;
        }

        .inv-totals-wrap {
            padding: 0;
            border-left: 1px solid var(--border-strong);
            display: flex;
            flex-direction: column;
        }

        .inv-totals-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .inv-totals-table td {
            padding: 6px 12px;
            color: #334155;
            border-bottom: 1px solid var(--border-strong);
        }

        .inv-totals-table tr:last-child td {
            border-bottom: none; /* Let the container border handle it */
        }

        .inv-totals-table td.label-col {
            border-right: 1px solid var(--border-strong);
            font-weight: 600;
            width: 55%;
        }
        
        .inv-totals-table td.amount-col {
            text-align: right;
            font-weight: 600;
            color: #1e293b;
            width: 45%;
        }

        /* Amount in Words row: keep middle divider visible */
        .inv-totals-table tr.words-row td {
            border-bottom: none;
            padding: 10px 12px;
        }
        
        .inv-amount-words-title {
            font-weight: 600;
            color: #1e293b;
        }

        .inv-amount-words {
            color: #334155;
            margin-top: 4px;
        }

        .inv-terms {
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-strong);
            font-size: 13px;
            color: #334155;
        }

        .inv-terms-title {
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
        }

        .inv-footer-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            border-top: 1px solid var(--border-strong);
        }

        .inv-footer-left {
            padding: 16px;
            border-right: 1px solid var(--border-strong);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .inv-footer-note {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .inv-footer-brand {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .inv-footer-brand span { color: var(--accent); }

        .inv-sign-block {
            padding: 16px;
            padding-top: 64px; /* Space for signature */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
        }

        .inv-sign-line {
            width: 160px;
            height: 1px;
            background: var(--text-muted);
            margin: 0 0 8px 0;
        }

        .inv-sign-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ── FAB Print ── */
        .fab-print {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 50;
        }

        .fab-print button {
            border: none;
            padding: 14px 26px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(79, 70, 229, 0.4);
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .fab-print button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(79, 70, 229, 0.5);
        }

        @page {
            size: A4;
            margin: 10mm 8mm;
        }

        @media print {
            body {
                background: #fff;
            }

            .scaled-container {
                padding: 0 !important;
                width: 100% !important;
                margin: 0 !important;
            }

            .os-page,
            .inv-page {
                padding: 0 !important;
                max-width: 100% !important;
                width: 100% !important;
            }

            .os-card,
            .inv-doc,
            .premium-card {
                box-shadow: none !important;
                border: 1px solid #000 !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
            }

            .fab-print {
                display: none !important;
            }

            .inv-table tr {
                page-break-inside: avoid;
            }
            .inv-doc {
                page-break-inside: auto;
            }
        }

        /* Removed media max-width 640px to enable proper scaled preview */
    </style>
</head>

<body>
    <!-- Loader -->
    <div id="loader" class="loader-wrap">
        <div class="spinner"></div>
        <div class="loader-text">Loading details…</div>
        <div class="loader-sub">Fetching your receipt securely</div>
    </div>

    <!-- Error -->
    <div id="error-screen" class="error-wrap">
        <div class="error-icon">⚠️</div>
        <h2 class="error-title" id="error-title">Receipt Not Found</h2>
        <p class="error-desc" id="error-message">The receipt link is invalid or data is unavailable.</p>
        <button class="btn-retry" onclick="window.location.reload()">Try Again</button>
    </div>

    <!-- Main content (injected by JS) -->
    <div id="content-wrap"></div>

    <!-- FAB -->
    <div class="fab-print" id="fabPrint" style="display:none;">
        <button type="button" onclick="printWithFilename()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 6 2 18 2 18 9" />
                <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
                <rect x="6" y="14" width="12" height="8" />
            </svg>
            Download / Print
        </button>
    </div>

    <script>
        const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
            ? 'http://localhost:8000'
            : 'https://api.snapkhata.com';

        // Filename stored by each renderer: ShopName_ReceiptNo_Date
        window._pdfFilename = 'Receipt';

        /** Convert a string to a safe filename segment */
        function slugify(str) {
            return String(str || '')
                .trim()
                .replace(/[^\w\s\-]/g, '')
                .replace(/\s+/g, '_')
                .replace(/_+/g, '_')
                .replace(/^_|_$/g, '');
        }

        /** Format date as DD-Mon-YYYY for the filename (e.g. 28-Mar-2026) */
        function fmtDateForFilename(raw) {
            if (!raw) return '';
            try {
                let d;
                if (/^\d{2}-\d{2}-\d{4}$/.test(raw)) {
                    const [dd, mm, yyyy] = raw.split('-');
                    d = new Date(`${yyyy}-${mm}-${dd}`);
                } else {
                    d = new Date(raw);
                }
                if (isNaN(d)) return '';
                const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                return `${String(d.getDate()).padStart(2,'0')}-${months[d.getMonth()]}-${d.getFullYear()}`;
            } catch { return ''; }
        }

        /** Print with descriptive filename (browsers use document.title as PDF name) */
        function printWithFilename() {
            const original = document.title;
            document.title = window._pdfFilename || original;
            window.print();
            window.addEventListener('afterprint', function restore() {
                document.title = original;
                window.removeEventListener('afterprint', restore);
            });
        }

        // ── helpers ──────────────────────────────────────────────────────────
        const $ = id => document.getElementById(id);
        const hide = id => { const el = $(id); if (el) el.style.display = 'none'; };
        const show = id => { const el = $(id); if (el) el.style.display = 'block'; };

        const fmtMoney = v => {
            const num = Number(v || 0);
            return '₹ ' + (num % 1 === 0 
                ? num.toLocaleString('en-IN', { maximumFractionDigits: 0 }) 
                : num.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
        };
        const fmtQty = v => {
            const num = Number(v || 0);
            return num % 1 === 0 
                ? num.toLocaleString('en-IN', { maximumFractionDigits: 0 }) 
                : num.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        };
        const fmtDate = raw => {
            if (!raw) return '—';
            try {
                let d;
                if (/^\d{2}-\d{2}-\d{4}$/.test(raw)) {
                    const [dd, mm, yyyy] = raw.split('-');
                    d = new Date(`${yyyy}-${mm}-${dd}`);
                } else {
                    d = new Date(raw);
                }
                if (isNaN(d)) return raw;
                return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
            } catch { return raw; }
        };

        function showError(title, msg) {
            hide('loader');
            const el = $('error-screen');
            if (el) { el.style.display = 'flex'; }
            if (title) $('error-title').textContent = title;
            if (msg) $('error-message').textContent = msg;
        }

        function numberToWords(n) {
            const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve',
                'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
            const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
            if (n === 0) return 'Zero';
            function below1000(num) {
                if (num < 20) return ones[num];
                if (num < 100) return tens[Math.floor(num / 10)] + (num % 10 ? ' ' + ones[num % 10] : '');
                return ones[Math.floor(num / 100)] + ' Hundred' + (num % 100 ? ' ' + below1000(num % 100) : '');
            }
            let result = '';
            const crore = Math.floor(n / 10000000); n %= 10000000;
            const lakh = Math.floor(n / 100000); n %= 100000;
            const thousand = Math.floor(n / 1000); n %= 1000;
            const rest = n;
            if (crore) result += below1000(crore) + ' Crore ';
            if (lakh) result += below1000(lakh) + ' Lakh ';
            if (thousand) result += below1000(thousand) + ' Thousand ';
            if (rest) result += below1000(rest);
            return result.trim();
        }

        // ── main ─────────────────────────────────────────────────────────────
        async function fetchAndRender() {
            const params = new URLSearchParams(window.location.search);
            
            // Support 'i', 'id' or 'party' for orderId
            let orderId = params.get('i') || params.get('id') || params.get('party');
            if (!orderId) {
                const m = window.location.search.match(/[?&](?:id|i|party)(?:=|%3D)([^&]+)/i);
                if (m) orderId = decodeURIComponent(m[1]);
            }
            if (!orderId) { showError('Invalid Link', 'No receipt or party ID found in URL.'); return; }

            const uParam = params.get('u'); // username
            const signedToken = params.get('st');
            const expiresAt = params.get('exp');

            try {
                let apiUrl = `${API_BASE}/api/public/receipts/${orderId}`;
                if (uParam) {
                    apiUrl += `?u=${encodeURIComponent(uParam)}`;
                }
                if (signedToken) {
                    apiUrl += `${apiUrl.includes('?') ? '&' : '?'}st=${encodeURIComponent(signedToken)}`;
                }
                if (expiresAt) {
                    apiUrl += `${apiUrl.includes('?') ? '&' : '?'}exp=${encodeURIComponent(expiresAt)}`;
                }
                const resp = await fetch(apiUrl);
                if (!resp.ok) {
                    if (resp.status === 404) throw new Error('not_found');
                    if (resp.status === 401 || resp.status === 403) throw new Error('unauthorized');
                    throw new Error('server_error');
                }
                const data = await resp.json();

                // ── Photo view mode: show only the receipt image ──────────────────
                const viewMode = params.get('view');
                if (viewMode === 'photo') {
                    renderPhotoView(data);
                    return;
                }

                // Support 'g' or 'gst_mode' - prioritize backend but allow URL override for backward compatibility
                let gstMode = data.gst_mode && data.gst_mode !== 'none' ? data.gst_mode : 'none';
                if (params.has('g')) gstMode = params.get('g');
                else if (params.has('gst_mode')) gstMode = params.get('gst_mode');

                // Support 'p' or 'pm' for payment_mode
                if (params.has('p')) data.payment_mode = params.get('p');
                else if (params.has('pm')) data.payment_mode = params.get('pm');

                // Support 'r' or 'ra' for received_amount
                if (params.has('r')) data.received_amount = Number(params.get('r'));
                else if (params.has('ra')) data.received_amount = Number(params.get('ra'));

                // Support 'b' or 'bd' for balance_due
                if (params.has('b')) data.balance_due = Number(params.get('b'));
                else if (params.has('bd')) data.balance_due = Number(params.get('bd'));

                if (data.type === 'ledger') {
                    renderAccountStatement(data);
                } else if (gstMode === 'none') {
                    renderOrderSummary(data);
                } else {
                    renderGstInvoice(data, gstMode);
                }
            } catch (err) {
                if (err.message === 'not_found') showError('Receipt Not Found', 'We could not locate this receipt.');
                else if (err.message === 'unauthorized') showError('Link Expired', 'This receipt link is invalid or has expired.');
                else showError('Unable to Load', 'Please check your connection and try again.');
            }
        }

        // ── PHOTO VIEW renderer ───────────────────────────────────────────────────
        function renderPhotoView(data) {
            // Switch to mobile-friendly viewport for full-screen photo experience
            const viewportMeta = document.querySelector('meta[name="viewport"]');
            if (viewportMeta) viewportMeta.setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=5');

            const receiptLink = data.receipt_link;
            if (!receiptLink) {
                showError('Photo Not Available', 'The receipt image could not be found. Please contact the shop.');
                return;
            }

            const shopName = data.shop_name || 'Our Shop';
            document.title = `Receipt • ${shopName}`;

            const html = `
            <div style="
                height: 100dvh;
                background: #0d0d0d;
                display: flex;
                flex-direction: column;
                font-family: 'Inter', -apple-system, sans-serif;
                overflow: hidden;
            ">
                <!-- Header: shop name only, no SnapKhata badge -->
                <div style="
                    background: #111111;
                    border-bottom: 1px solid #1f1f1f;
                    padding: 12px 18px;
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    flex-shrink: 0;
                ">
                    <div>
                        <div style="
                            font-size: 15px;
                            font-weight: 700;
                            color: #f1f1f1;
                            letter-spacing: -0.2px;
                            line-height: 1.2;
                        ">${shopName}</div>
                        <div style="
                            font-size: 11px;
                            color: #666;
                            margin-top: 2px;
                            letter-spacing: 0.3px;
                            text-transform: uppercase;
                        ">Receipt Photo</div>
                    </div>
                    <!-- Pinch to zoom hint -->
                    <div style="
                        font-size: 11px;
                        color: #555;
                        display: flex;
                        align-items: center;
                        gap: 4px;
                    ">
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            <line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/>
                        </svg>
                        Pinch to zoom
                    </div>
                </div>

                <!-- Image area: fills remaining space, no scroll -->
                <div style="
                    flex: 1;
                    min-height: 0;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    padding: 12px;
                    background: #0d0d0d;
                    touch-action: pinch-zoom;
                ">
                    <img
                        src="${receiptLink}"
                        alt="Receipt from ${shopName}"
                        style="
                            max-width: 100%;
                            max-height: 100%;
                            width: auto;
                            height: auto;
                            object-fit: contain;
                            border-radius: 8px;
                            box-shadow: 0 4px 32px rgba(0,0,0,0.7);
                            display: block;
                        "
                        onerror="this.parentNode.innerHTML='<div style=\'text-align:center;color:#666;padding:40px;\'>\u26a0\ufe0f Could not load receipt image</div>';"
                    />
                </div>

                <!-- Footer: Save button + single SnapKhata credit -->
                <div style="
                    background: #111111;
                    border-top: 1px solid #1f1f1f;
                    padding: 12px 18px;
                    display: flex;

        // ── Download helper for photo view ────────────────────────────────────
        // Must fetch as blob first because <a download> on a cross-origin URL
        // is blocked by browsers — they open the URL instead of downloading it.
        async function downloadReceipt(url) {
            const btn = event.currentTarget;
            const original = btn.innerHTML;
            btn.innerHTML = '<span style="opacity:0.7">Saving…</span>';
            btn.disabled = true;
            try {
                const resp = await fetch(url);
                const blob = await resp.blob();
                const objUrl = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = objUrl;
                a.download = 'receipt.jpg';
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(objUrl);
            } catch (err) {
                // Fallback: open image in new tab so user can long-press save
                window.open(url, '_blank');
            } finally {
                btn.innerHTML = original;
                btn.disabled = false;
            }
        }

                                            <td style="padding: 4px 0; font-weight: 600; color: #334155; text-align: center; width: 20px;">:</td>
                                            <td style="padding: 4px 0; font-weight: 600; color: #1e293b; text-align: right;">${fmtMoney(totalSubtotal)}</td>
                                        </tr>
                                        <tr>
                                            <td style="padding: 4px 0; font-weight: 600; color: #334155;">Total GST</td>
                                            <td style="padding: 4px 0; font-weight: 600; color: #334155; text-align: center; width: 20px;">:</td>
                                            <td style="padding: 4px 0; font-weight: 600; color: #1e293b; text-align: right;">${fmtMoney(gstAmt)}</td>
                                        </tr>
                                        <tr>
                                            <td style="padding: 4px 0; font-weight: 700; color: #1e293b; font-size: 14px;">Total</td>
                                            <td style="padding: 4px 0; font-weight: 700; color: #1e293b; font-size: 14px; text-align: center; width: 20px;">:</td>
                                            <td style="padding: 4px 0; font-weight: 700; color: #1e293b; font-size: 14px; text-align: right;">${fmtMoney(grandTotal)}</td>
                                        </tr>
                                        ${receivedAmount !== null ? `
                                        <tr>
                                            <td style="padding: 4px 0; font-weight: 600; color: #334155;">Amount Paid</td>
                                            <td style="padding: 4px 0; font-weight: 600; color: #334155; text-align: center; width: 20px;">:</td>
                                            <td style="padding: 4px 0; font-weight: 600; color: #334155; text-align: right;">-${fmtMoney(receivedAmount)}</td>
                                        </tr>
                                        ` : ''}
                                        ${balanceDue !== null ? `
                                        <tr>
                                            <td style="padding: 4px 0; font-weight: 700; color: ${balanceDue > 0 ? '#b95d5d' : '#15803d'};">Balance Due</td>
                                            <td style="padding: 4px 0; font-weight: 700; color: ${balanceDue > 0 ? '#b95d5d' : '#15803d'}; text-align: center; width: 20px;">:</td>
                                            <td style="padding: 4px 0; font-weight: 700; color: ${balanceDue > 0 ? '#b95d5d' : '#15803d'}; text-align: right;">${fmtMoney(balanceDue)}</td>
                                        </tr>
                                        ` : ''}
                                    </table>
                                </div>
                                <div style="padding: 10px 12px; border-top: 1px solid var(--border-strong);">
                                    <div style="font-weight: 700; color: #1e293b; margin-bottom: 4px; font-size: 13px;">Amount in Words :</div>
                                    <div style="color: #334155; font-size: 13px;">${wordsTotal} Rupees only</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="inv-terms">
                            <div class="inv-terms-title">Terms And Conditions:</div>
                            <div>Thank you for doing business with us.</div>
                        </div>

                        <div class="inv-footer-grid">
                            <div class="inv-footer-left">
                                <div class="inv-footer-note">This is a computer-generated invoice and does not require a signature.</div>
                                <div class="inv-footer-brand">Powered by <span>SnapKhata</span></div>
                            </div>
                            <div class="inv-sign-block">
                                <div class="inv-sign-line"></div>
                                <div class="inv-sign-label">Authorised Signature</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;

            $('content-wrap').innerHTML = html;
            $('content-wrap').style.display = 'block';
            $('fabPrint').style.display = 'block';
            hide('loader');
        }

        // ─────────────────────────────────────────────────────────────────────
        // ACCOUNT STATEMENT renderer
        // ─────────────────────────────────────────────────────────────────────
        function renderAccountStatement(data) {
            document.title = `Account Statement - ${data.customer_name || 'Customer'} • SnapKhata`;

            // Build PDF filename: ShopName_CustomerName_Date
            const _shop     = slugify(data.shop_name || 'Shop');
            const _customer = slugify(data.customer_name || 'Statement');
            const _date     = fmtDateForFilename(new Date().toISOString());
            window._pdfFilename = [_shop, _customer, _date].filter(Boolean).join('_');

            const items = Array.isArray(data.items) ? data.items : [];
            const grandTotal = Number(data.balance_due) || 0;
            const wordsTotal = numberToWords(Math.round(Math.abs(grandTotal)));

            let itemsHtml = '';
            items.forEach((item, idx) => {
                const amount = Number(item.amount || 0);
                const date = fmtDate(item.date);
                itemsHtml += `
                <tr>
                    <td class="center">${idx + 1}</td>
                    <td>
                        <div style="font-weight:600;color:#1e293b;">${item.name || 'Transaction'}</div>
                        <div style="font-size:11px;color:#64748b;">${date}</div>
                    </td>
                    <td class="center">${item.type || '—'}</td>
                    <td class="right" style="color:${item.type === 'PAYMENT' ? '#16a34a' : '#1e293b'}">
                        ${item.type === 'PAYMENT' ? '-' : ''}${fmtMoney(amount)}
                    </td>
                </tr>`;
            });

            const html = `
            <div class="scaled-container">
                <div class="inv-page">
                    <div class="inv-doc-title">Account Statement</div>
                    <div class="inv-doc">
                        <div class="inv-header-grid">
                            <div class="inv-shop-info">
                                <div class="inv-shop-name">${data.shop_name || 'Our Shop'}</div>
                                <div class="inv-shop-detail">
                                    ${data.shop_address ? `<div style="margin-bottom:2px;">${data.shop_address}</div>` : ''}
                                    ${data.shop_phone ? `<div>Phone: +91 ${String(data.shop_phone).replace('+91', '').trim()}</div>` : ''}
                                </div>
                            </div>
                            <div class="inv-meta-grid">
                                <div class="inv-bill-to">
                                    <div class="inv-col-label">Customer Details:</div>
                                    <div class="inv-col-val">
                                        <div><strong>${data.customer_name || 'Customer'}</strong></div>
                                        ${data.customer_phone ? `<div>Contact No: +91 ${String(data.customer_phone).replace('+91', '').trim()}</div>` : ''}
                                        ${data.vehicle_number ? `<div style="margin-top:4px;">Vehicle: ${data.vehicle_number}</div>` : ''}
                                    </div>
                                </div>
                                <div class="inv-invoice-details">
                                    <div class="inv-col-label">Statement Info:</div>
                                    <div class="inv-col-val">
                                        <div>Date: ${fmtDate(new Date().toISOString())}</div>
                                        <div style="margin-top:6px;font-weight:700;color:${grandTotal <= 0 ? '#16a34a' : '#ea580c'}">
                                            ${grandTotal <= 0 ? 'CLEARED' : 'OUTSTANDING'}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <table class="inv-table">
                            <thead>
                                <tr>
                                    <th class="center" style="width:8%">#</th>
                                    <th style="width:52%">Transaction Details</th>
                                    <th class="center" style="width:20%">Type</th>
                                    <th class="right" style="width:20%">Amount (₹)</th>
                                </tr>
                            </thead>
                            <tbody>${itemsHtml}</tbody>
                        </table>

                        <div class="inv-summary-grid">
                            <div class="inv-empty-left"></div>
                            <div class="inv-totals-wrap">
                                <div style="padding: 10px 12px;">
                                    <table style="width: 100%; border-collapse: collapse; font-size: 14px;">
                                        <tr>
                                            <td style="padding: 8px 0; font-weight: 700; color: #334155; font-size: 16px;">Net Balance</td>
                                            <td style="padding: 8px 0; font-weight: 700; color: #334155; font-size: 16px; text-align: center; width: 20px;">:</td>
                                            <td style="padding: 8px 0; font-weight: 700; color: ${grandTotal > 0 ? '#ea580c' : '#16a34a'}; font-size: 16px; text-align: right;">${fmtMoney(grandTotal)}</td>
                                        </tr>
                                    </table>
                                </div>
                                <div style="padding: 10px 12px; border-top: 1px solid var(--border-strong);">
                                    <div style="font-weight: 700; color: #1e293b; margin-bottom: 4px; font-size: 13px;">In Words :</div>
                                    <div style="color: #334155; font-size: 13px;">${wordsTotal} Rupees ${grandTotal > 0 ? 'Payable' : 'Credit Balance'}</div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="inv-footer-grid">
                            <div class="inv-footer-left">
                                <div class="inv-footer-note">This is an automated account statement summarizing your transactions.</div>
                                <div class="inv-footer-brand">Powered by <span>SnapKhata</span></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;

            $('content-wrap').innerHTML = html;
            $('content-wrap').style.display = 'block';
            $('fabPrint').style.display = 'block';
            hide('loader');
        }

        async function init() {
            await fetchAndRender();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
